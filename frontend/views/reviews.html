<!-- Reviews page skeleton. reviews-view.js fills the subtitle and the list (or the empty state). -->
<header class="page-head">
  <div>
    <h1 class="page-title">Your reviews</h1>
    <p class="muted" data-bind="subtitle"></p>
  </div>
  <button type="button" class="btn btn-primary" data-new-review><span data-icon="plus" data-size="18"></span> Write a review</button>
</header>
<div class="slot" data-slot="list"></div>
