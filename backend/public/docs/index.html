<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CineTrack API documentation</title>
  <!-- Swagger UI (version 5.17.14) is loaded from a CDN, so this page needs an internet connection. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>

  <script>
    // The page asks the backend for the real specification (backend/openapi.yaml) at /openapi.
    SwaggerUIBundle({
      url: '/openapi',
      dom_id: '#swagger-ui'
    });
  </script>
</body>
</html>
